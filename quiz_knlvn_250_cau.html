      opts: [
        "Đoán tiến độ dự án dựa trên kinh nghiệm",
        "Xác định đơn vị đo lường và công cụ đo lường phù hợp",
        "Chờ đến cuối dự án mới kiểm tra",
        "Chia việc mà không cần tiêu chuẩn đánh giá",

      ans: 1,
    },
    {
      q: "Trong chiến dịch quảng cáo, nhóm gặp vấn đề sai lệch số liệu. Áp dụng nguyên tắc 2C, hành động đúng nhất là:",
      opts: [
        "Tăng ngân sách để bù sai số",
        "Rà soát công cụ đo lường và các bước thu thập dữ liệu",

      ],
      ans: 1,
    },
  ];

  const BATCH = 20;
  let questions = [],
    current = 0,
    score = 0,
    answered = false,
    selected = -1;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz(n) {
    questions = shuffle([...ALL_QUESTIONS]).slice(0, n);
    current = 0;
    score = 0;
    renderQuestion();
  }

  function renderStart() {
    const app = document.getElementById("app");
    app.innerHTML = `
    <div style="background:var(--color-background-primary);border-radius:var(--border-radius-lg);padding:40px;box-shadow:var(--shadow-xl);text-align:center;animation:fadeInUp 0.5s ease-out">
      <div style="font-size:64px;margin-bottom:16px">🎯</div>
      <h2 style="font-size:28px;font-weight:700;color:var(--color-text-primary);margin-bottom:12px;line-height:1.3">Trắc nghiệm Kỹ năng làm việc nhóm</h2>
      <p style="font-size:16px;color:var(--color-text-secondary);margin-bottom:32px;line-height:1.6">Bộ câu hỏi ôn tập từ tài liệu TN-KNLVN - Kiểm tra và nâng cao kiến thức của bạn!</p>
      <p style="font-size:15px;color:var(--color-text-tertiary);margin-bottom:24px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Chọn số câu hỏi muốn ôn tập:</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;justify-content:center;margin-bottom:32px">
        <button onclick="startQuiz(10)" class="primary" style="justify-content:center;align-items:center;min-height:60px">📊 10 câu</button>
        <button onclick="startQuiz(20)" class="primary" style="justify-content:center;align-items:center;min-height:60px">📚 20 câu</button>
        <button onclick="startQuiz(50)" class="primary" style="justify-content:center;align-items:center;min-height:60px">🎓 50 câu</button>
        <button onclick="startQuiz(ALL_QUESTIONS.length)" class="primary" style="justify-content:center;align-items:center;min-height:60px">🏆 Tất cả ${ALL_QUESTIONS.length} câu</button>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding-top:20px;border-top:2px solid var(--color-border-tertiary)">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-tertiary)">
          <span style="font-size:18px">✨</span> Câu hỏi xáo trộn ngẫu nhiên
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-tertiary)">
          <span style="font-size:18px">⚡</span> Phản hồi tức thì
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-tertiary)">
          <span style="font-size:18px">📈</span> Theo dõi tiến độ
        </div>
      </div>
    </div>`;
  }

  function renderQuestion() {
    if (current >= questions.length) {
      renderEnd();
      return;
    }
    answered = false;
    selected = -1;
    const q = questions[current];
    const letters = ["A", "B", "C", "D"];
    const app = document.getElementById("app");
    app.innerHTML = `
    <div class="header">
      <div class="title">Câu ${current + 1} / ${questions.length}</div>
      <div class="stats">
        <div class="stat">✓ <span>${score}</span></div>
        <div class="stat">✗ <span>${current - score}</span></div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(current / questions.length) * 100}%"></div></div>
    <div class="question-card">
      <div class="q-number">Câu hỏi ${current + 1} trong ${questions.length} câu</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.opts
          .map(
            (o, i) => `<div class="opt" id="opt${i}" onclick="choose(${i})">
          <span class="opt-letter">${letters[i]}</span>
          <span class="opt-text">${o}</span>
        </div>`,
          )
          .join("")}
      </div>
      <div id="feedback"></div>
    </div>
    <div class="actions" id="actions"></div>`;
  }

  function choose(idx) {
    if (answered) return;
    answered = true;
    selected = idx;
    const q = questions[current];
    const letters = ["A", "B", "C", "D"];
    
    // Add visual feedback immediately
    document.querySelectorAll(".opt").forEach((el, i) => {
      el.style.pointerEvents = 'none'; // Disable further clicks
      if (i === q.ans) {
        setTimeout(() => el.classList.add("correct"), 100);
      } else if (i === idx && idx !== q.ans) {
        setTimeout(() => el.classList.add("wrong"), 100);
      }
    });
    
    const fb = document.getElementById("feedback");
    if (idx === q.ans) {
      score++;
      fb.className = "feedback correct";
      fb.innerHTML = `<strong>✓ Chính xác!</strong> Đáp án đúng là <strong>${letters[q.ans]}. ${q.opts[q.ans]}</strong>`;
    } else {
      fb.className = "feedback wrong";
      fb.innerHTML = `<strong>✗ Chưa đúng!</strong> Đáp án đúng là <strong>${letters[q.ans]}. ${q.opts[q.ans]}</strong>`;
    }
    
    const actions = document.getElementById("actions");
    if (current < questions.length - 1) {
      actions.innerHTML = `<button class="primary" onclick="nextQ()">Câu tiếp theo →</button>`;
    } else {
      actions.innerHTML = `<button class="primary" onclick="renderEnd()">🏆 Xem kết quả</button>`;
    }
  }

  function nextQ() {
    current++;
    renderQuestion();
  }

  function renderEnd() {
    const pct = Math.round((score / questions.length) * 100);
    let msg =
      pct >= 90
        ? "🎉 Xuất sắc! Bạn thật tuyệt vời!"
        : pct >= 80
          ? "👏 Rất tốt!继续保持!"
          : pct >= 60
            ? "👍 Khá tốt! Cố gắng hơn nữa!"
            : pct >= 40
              ? "📚 Cần ôn tập thêm"
              : "💪 Hãy cố gắng nhiều hơn!";
    
    const app = document.getElementById("app");
    app.innerHTML = `
    <div class="end-card">
      <div style="font-size:48px;margin-bottom:12px">${pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '📚'}</div>
      <div style="font-size:18px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Kết quả bài làm</div>
      <div class="score-big">${pct}%</div>
      <div class="score-label">${msg}</div>
      <div class="score-grid">
        <div class="score-metric"><div class="score-metric-val" style="color:var(--color-success)">${score}</div><div class="score-metric-label">Câu đúng</div></div>
        <div class="score-metric"><div class="score-metric-val" style="color:var(--color-danger)">${questions.length - score}</div><div class="score-metric-label">Câu sai</div></div>
        <div class="score-metric"><div class="score-metric-val">${questions.length}</div><div class="score-metric-label">Tổng số câu</div></div>
      </div>
      <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:20px;margin-bottom:24px">
        <div style="font-size:14px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:600">Đánh giá chi tiết</div>
        <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px">
          <div style="text-align:center">
            <div style="font-size:24px;font-weight:700;color:var(--color-primary)">${Math.round(score/questions.length*100)}%</div>
            <div style="font-size:12px;color:var(--color-text-tertiary)">Tỷ lệ đúng</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:24px;font-weight:700;color:var(--color-warning)">${questions.length - score}</div>
            <div style="font-size:12px;color:var(--color-text-tertiary)">Cần cải thiện</div>
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
        <button onclick="startQuiz(questions.length)" class="primary" style="justify-content:center">↻ Làm lại bộ này</button>
        <button onclick="renderStart()" style="justify-content:center">📋 Chọn lại số câu</button>
      </div>
    </div>`;
  }

  renderStart();
</script>
